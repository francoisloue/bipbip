openapi: 3.0.0
info:
  title: BipBip REST API
  description: API permettant la gestion des utilisateurs, des évènements et des médicaments de l'application BipBip.
  version: 0.1.0
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [ id, name, surname, age, weight, height ]
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        age:
          type: integer
        weight:
          type: integer
        height:
          type: integer
    Event:
      type: object
      required: [ id, user_id, name, description, frequency, is_active, medication_id, take_pill_date ]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: string
        frequency:
          type: string
        is_active:
          type: boolean
        medication_id:
          type: integer
        take_pill_date:
          type: string
          format: date-time
    Medication:
      type: object
      required: [ id, name, image_url, notice_url ]
      properties:
        id:
          type: integer
        name:
          type: string
        image_url:
          type: string
        notice_url:
          type: string
paths:
  /v1/bipbip/user:
    get:
      tags: [User]
      operationId: getUserList
      security:
        - bearerAuth: []
      responses:
        200:
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: object
                required: [ status, users ]
                properties:
                  status:
                    type: integer
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags: [User]
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/bipbip/user/{id}:
    get:
      tags: [User]
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        200:
          description: Détails de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [User]
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      security:
        - bearerAuth: []
      responses:
        200:
          description: Utilisateur mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [User]
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        204:
          description: Utilisateur supprimé avec succès

  /v1/bipbip/event:
    get:
      tags: [Event]
      operationId: getEventList
      security:
        - bearerAuth: []
      responses:
        200:
          description: Liste des évènements
          content:
            application/json:
              schema:
                type: object
                required: [ status, events ]
                properties:
                  status:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
    post:
      tags: [Event]
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        201:
          description: Évènement créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /v1/bipbip/event/{id}:
    get:
      tags: [Event]
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        200:
          description: Détails de l'évènement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    put:
      tags: [Event]
      operationId: updateEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      security:
        - bearerAuth: []
      responses:
        200:
          description: Évènement mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    delete:
      tags: [Event]
      operationId: deleteEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        204:
          description: Évènement supprimé avec succès

  /v1/bipbip/medication:
    get:
      tags: [Medication]
      operationId: getMedicationList
      security:
        - bearerAuth: []
      responses:
        200:
          description: Liste des médicaments
          content:
            application/json:
              schema:
                type: object
                required: [ status, medications ]
                properties:
                  status:
                    type: integer
                  medications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medication'
    post:
      tags: [Medication]
      operationId: createMedication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Medication'
      responses:
        201:
          description: Médicament créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'

  /v1/bipbip/medication/{id}:
    get:
      tags: [Medication]
      operationId: getMedicationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        200:
          description: Détails du médicament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
    put:
      tags: [Medication]
      operationId: updateMedication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Medication'
      security:
        - bearerAuth: []
      responses:
        200:
          description: Médicament mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
    delete:
      tags: [Medication]
      operationId: deleteMedication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        204:
          description: Médicament supprimé avec succès

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bipbip-db
    environment:
      POSTGRES_DB: bipbip
      POSTGRES_USER: bipuser
      POSTGRES_PASSWORD: bipsecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
